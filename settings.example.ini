; VbeComplete 配置文件（模板）
; ─────────────────────────────────────────────────────────────────────────
; 用法：把想改的那一行的 `;` 删掉，改数值，存盘，重启 VbeComplete 生效。
;
;   优先级：环境变量 > 这个文件 > 程序里的默认值
;   环境变量要加前缀 `VBECOMPLETE_`（例：set VBECOMPLETE_LOG=1）
;   改错了不会把功能弄坏 —— 认不出的值会被跳过（那一项就按下一个来源算）。
;
; 说明：settings.ini 是你自己的配置，settings.example.ini 是这份模板。
;   只有下面列出的项会被读取，写别的名字不会生效。
;
; 排查"现在连的是哪本工作簿、光标在哪"：在项目文件夹里执行
;     VbeComplete.exe --probe
; ─────────────────────────────────────────────────────────────────────────

[settings]


; ==== 补全候选 ====
; 候选里**只放你自己写的名字**：过程名、变量名、参数名、常量名。
;   VBA 关键字、内建函数、内建类型、模块名 / 表名（Sheet1、ThisWorkbook）/
;   窗体名 / 类名、自定义类型名，一律不弹 —— 这一条不可配置（少弹几百条，
;   剩下的全是能直接用的）。
; IMPLICIT_HONOR_EXPLICIT = 1
;   模块写了 `Option Explicit` 时不再收"未声明的隐式变量"。0 = 照收
;   （关掉它等于在强制声明的模块里提示一堆编译不过的名字，一般不用动）
; VIEW_ROWS = 15
;   一屏最多显示几行（3~30）。候选不足时窗口自己变矮，不留白
; HIDE_ON_COMPLETE = 1
;   正在打的词已经是唯一候选（打全了）时自动收起候选窗。0 = 一直留着
; DECL_POPUP = 0
;   声明位置（正在起新名字）也出候选。1 = 出
; MEMBER_POPUP = 0
;   `对象.` 之后也出我们的候选。默认 0 = 一个都不出，整个让给 VBE 的成员列表；
;   1 = 出：代码里有 `Dim x As 类` / `Set x = New 类` 就按类型收窄，
;   定不出类型则出全工程候选。Ctrl+Space 不受这个开关影响，永远照弹
; NO_RECENT_PERSIST = 0
;   "最近用过优先"的记录只留内存、不读也不写 recent.json。1 = 不落盘

; ==== 补完之后补什么 ====
; NO_AUTOPAREN = 0
;   选中 Function 后自动插一对 `()`。1 = 不插
; NO_AUTOSPACE = 0
;   选中 Sub 后自动补一个空格。1 = 不补
; NO_AUTOPAIR = 0
;   自动配对括号 / 引号。1 = 关
; NO_IME_PUNCT = 0
;   中文标点 / 全角时也按半角配对。1 = 强制半角
; NO_ENTER_INDENT = 0
;   回车自动缩进。1 = 关（回车完全回到 VBE 原生）
; NO_AUTOCLOSE = 0
;   自动补 `End Sub` / `Next` 等收尾。1 = 只做缩进、不补收尾
; NO_BRANCH_ALIGN = 0
;   `Else` / `Case` 等分支的缩进对齐。1 = 关
; INDENT_UNIT = 
;   一级缩进用什么：`2` / `4` / `tab`；留空 = 照工程里的既有缩进自动判断
; NO_BS_DELLINE = 0
;   退格一次删掉整行空白。1 = 关
; NO_BS_DELPAIR = 0
;   退格一次删掉成对的空括号 / 空引号。1 = 关

; ==== 快捷键 ====
; NO_CTRL_NAV = 0
;   `Ctrl+↑` / `Ctrl+↓` 跳到本过程最后一个 Dim 行 / 收尾行上方最后一条代码。
;   1 = 关，按键还给 VBE
; NO_SHIFT_NAV = 0
;   `Shift+↑/↓` 跳出候选列表并上下移一行。1 = 关
; NO_SNIPPETS = 0
;   `Ctrl+Q` 代码片段窗。1 = 关，按键交还 VBE
; NO_COMMENT = 0
;   `Ctrl+/` 批量注释 / 取消注释。1 = 关，按键交还 VBE
; NO_INSERT_ABOVE = 0
;   `Ctrl+Shift+Enter` 在当前行上方插入新行。1 = 关，按键交还 VBE
; NO_DUP_LINE = 0
;   `Ctrl+D` 复制当前行（有选区 = 选中的几行）到下方。1 = 关
; NO_DEL_LINE = 0
;   `Ctrl+K` 删除当前行（有选区 = 选中的几行）。1 = 关

; ==== 候选窗外观 ====
; POPUP_FONT = 
;   字体名。留空 = 自动挑：先跟 VBE 编辑器字体（去掉 Light/Thin 字重），
;   读不到就用 JetBrains Mono / Cascadia Mono / Consolas 里装了的那个
; POPUP_FONT_SIZE = 0
;   0 = 比 VBE 小一号（默认）；-2 = 小两号；正数 = 直接用它
; POPUP_SEL_BG = #0A62B0
;   选中行底色（深蓝）
; POPUP_SEL_FG = #FFFFFF
;   选中行文字色
; POPUP_SEL_HIT = #FFD97A
;   选中行里命中字母的颜色
; TAB_WIDTH = 4
;   VBE 编辑器里一个 Tab 等于几个显示列（出厂 4）。只有你把 VBE 的
;   "工具 → 选项 → 编辑器 → 制表符宽度"改过才需要动它

; ==== 片段库 ====
; SNIPPET_DB = 
;   片段库路径。留空 = 项目文件夹下的 snippets-cs.db
;   只有这一个库文件（代码片段）

; ==== 开机自启 / 托盘 ====
; 开关在托盘右键菜单里（「开机自动启动」），这里一般不用改。
; AUTO_START = 1
;   只在"还没有 autostart.txt"时作为初值：第一次运行是否登记开机自启。

; ==== 性能 ====
; 正常使用不需要动这几项，只在排查"补全没跟上刚改的代码"时用。
; REQUIRE_KEY_TRIGGER = 1
;   只对按键触发补全；鼠标粘贴 / 拖拽 / 别的程序改代码引起的文本变化只收起
;   候选、不弹出。0 = 不管怎么变的都弹
; SCOPE_TTL = 2.0
;   全工程标识符缓存的刷新间隔（秒）。调小 = 别的模块新写的过程更快出现
; SNAP_MAX_AGE = 1.0
;   代码文本快照最长复用多久（秒）。0 = 每次都重读
; NO_SNAP_CACHE = 0
;   关掉"光标没动就不读文本"的两级快照读取。1 = 关（空闲时更费 CPU）

; ==== 排障 ====
; LOG = 0
;   写诊断日志。1 = 落盘（正常使用保持 0，关着时零开销）
